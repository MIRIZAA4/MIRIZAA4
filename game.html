<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משחק · משחקי משפחה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/skin.js"></script>
</head>
<body>
<header class="site"><div class="container">
  <a class="logo" href="index.html"><span class="mark"></span>משחקי משפחה</a>
  <nav><a href="index.html#games">← לכל המשחקים</a><span class="skins"><button data-skin="dark">שחור</button><button data-skin="light">לבן</button><button data-skin="color">צבעוני</button></span></nav>
</div></header>
<main class="container" id="main" style="padding-top:24px"></main>
<footer class="site"><div class="container">משחקי משפחה © תשפ"ז</div></footer>
<script src="assets/games-data.js"></script>
<script src="assets/access.js"></script>
<script>
(function(){
  const id=(location.hash||"").replace("#","")||new URLSearchParams(location.search).get("id");
  const g=GAMES.find(x=>x.id===id);
  const m=document.getElementById("main");
  if(!g){ m.innerHTML='<div class="section"><h2>המשחק לא נמצא</h2><a class="btn primary" href="index.html">לכל המשחקים</a></div>'; return; }
  document.title=g.title+" · משחקי משפחה";
  const owned=Access.owned(g.id);
  const catName=c=>{const x=CATEGORIES.find(y=>y.id===c); return x?x.icon+" "+x.name:c;};
  m.innerHTML=`
  <div class="section" style="display:grid;grid-template-columns:1fr;gap:18px;border-top:0">
    <img class="cover" src="${g.cover}" alt="" onerror="this.remove()">
    <div class="row" style="align-items:flex-start;gap:20px">
      <div class="art tone-${g.tone}" style="font-size:4rem;line-height:1;width:120px;height:120px;display:flex;align-items:center;justify-content:center;flex:none">${g.icon}</div>
      <div style="flex:1;min-width:240px">
        <h1 style="margin:0;color:var(--accent)">${g.title}</h1>
        <div class="muted">${g.type}</div>
        <div class="tags" style="margin:8px 0">${g.cats.map(c=>'<span class="tag">'+catName(c)+'</span>').join("")}</div>
        <table style="border-collapse:collapse;font-size:.95rem">
          <tr><td class="muted" style="padding:2px 0 2px 16px">שחקנים</td><td>${g.players}</td></tr>
          <tr><td class="muted" style="padding:2px 0 2px 16px">זמן</td><td>${g.time}</td></tr>
          <tr><td class="muted" style="padding:2px 0 2px 16px">גיל</td><td>${g.age}</td></tr>
          <tr><td class="muted" style="padding:2px 0 2px 16px">רמה</td><td>${g.level}</td></tr>
        </table>
      </div>
    </div>
    <p style="font-size:1.1rem">${g.long}</p>
    <div><h3 style="margin:0 0 6px;color:var(--accent)">מה מקבלים</h3><ul>${g.includes.map(i=>"<li>"+i+"</li>").join("")}</ul></div>
    <div class="row" style="gap:12px">
      <a class="btn primary" href="${g.url}" style="font-size:1.1rem">▶ ${owned?"למשחק":"לנסות בחינם"}</a>
      ${owned?'<span class="badge">המשחק שלכם</span>':`<span class="price" style="font-size:1.2rem">${g.price} ₪</span><span class="small muted">${g.freeStages}</span><button class="btn gold" id="codeBtn">יש לי קוד פתיחה</button>`}
    </div>
  </div>`;
  const b=document.getElementById("codeBtn"); if(b) b.onclick=()=>Access.require(g.id,()=>location.reload());
  window.addEventListener('hashchange',()=>location.reload());
})();
</script>
</body>
</html>
