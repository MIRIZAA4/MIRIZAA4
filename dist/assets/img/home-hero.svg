<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121a24"/><stop offset="1" stop-color="#2a1f3d"/></linearGradient>
 <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfaf3"/><stop offset="1" stop-color="#e2d9c4"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f6f6"/><stop offset=".5" stop-color="#b8bcc6"/><stop offset="1" stop-color="#eeeeee"/></linearGradient>
 <linearGradient id="bread" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2a559"/><stop offset="1" stop-color="#a86b2d"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".2" r=".7"><stop offset="0" stop-color="#ffd98a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".4"/></filter>
</defs>
<rect width="1600" height="700" fill="url(#bg)"/>
<rect width="1600" height="700" fill="url(#glow)"/>
<!-- window -->
<rect x="1180" y="60" width="300" height="260" fill="#1b2a3a" stroke="#6b4523" stroke-width="14"/><path d="M1330 60v260M1180 190h300" stroke="#6b4523" stroke-width="10"/>
<g fill="#fff" opacity=".8"><circle cx="1230" cy="110" r="2"/><circle cx="1400" cy="90" r="2"/><circle cx="1300" cy="150" r="1.5"/><circle cx="1440" cy="240" r="2"/><circle cx="1250" cy="260" r="1.5"/></g>
<circle cx="1390" cy="130" r="26" fill="#fff4cf"/>
<!-- table -->
<path d="M100 420 L1500 420 L1600 700 L0 700Z" fill="url(#cloth)"/>
<path d="M100 420 L1500 420 L1520 470 L80 470Z" fill="#fff" opacity=".6"/>
<!-- candlesticks -->
<g transform="translate(300 260)" filter="url(#shadow)"><rect x="-8" y="60" width="16" height="100" fill="url(#silver)"/><rect x="-30" y="160" width="60" height="12" fill="url(#silver)"/><rect x="-6" y="0" width="12" height="60" fill="#fff8e6"/><ellipse cx="0" cy="-6" rx="9" ry="16" fill="#ffd166"/><ellipse cx="0" cy="-2" rx="4" ry="8" fill="#fff"/>
<rect x="72" y="60" width="16" height="100" fill="url(#silver)"/><rect x="50" y="160" width="60" height="12" fill="url(#silver)"/><rect x="74" y="0" width="12" height="60" fill="#fff8e6"/><ellipse cx="80" cy="-6" rx="9" ry="16" fill="#ffd166"/><ellipse cx="80" cy="-2" rx="4" ry="8" fill="#fff"/></g>
<!-- challah under cover -->
<g transform="translate(560 380)" filter="url(#shadow)"><path d="M0 60 q0 -40 40 -50 h200 q40 10 40 50 v40 H0z" fill="url(#bread)"/><path d="M20 30 q60 -40 120 0 q60 -40 120 0" stroke="#f3d27a" stroke-width="10" fill="none"/><path d="M-20 -10 q140 -60 320 0 L300 100 H-20z" fill="#f6f1e6" opacity=".85"/><path d="M40 40 h200" stroke="#7a5bd6" stroke-width="4"/></g>
<!-- kiddush cup -->
<g transform="translate(940 420)" filter="url(#shadow)"><path d="M-40 0 q0 60 40 70 q40 -10 40 -70z" fill="url(#silver)"/><rect x="-5" y="68" width="10" height="34" fill="#c9ccd4"/><ellipse cx="0" cy="106" rx="30" ry="8" fill="url(#silver)"/><ellipse cx="0" cy="0" rx="40" ry="8" fill="#7a1f2b"/></g>
<!-- dice + cards + tiles -->
<g transform="translate(1180 470) rotate(-12)" filter="url(#shadow)"><rect x="0" y="0" width="70" height="70" rx="10" fill="#fff"/><g fill="#1d2433"><circle cx="18" cy="18" r="7"/><circle cx="52" cy="18" r="7"/><circle cx="35" cy="35" r="7"/><circle cx="18" cy="52" r="7"/><circle cx="52" cy="52" r="7"/></g></g>
<g transform="translate(1270 500) rotate(10)" filter="url(#shadow)"><rect x="0" y="0" width="70" height="70" rx="10" fill="#e2542b"/><g fill="#fff"><circle cx="18" cy="18" r="7"/><circle cx="52" cy="52" r="7"/></g></g>
<g transform="translate(120 500) rotate(-8)" filter="url(#shadow)"><rect x="0" y="0" width="120" height="170" rx="8" fill="#fff" stroke="#1d2433" stroke-width="4"/><rect x="14" y="14" width="92" height="142" rx="4" fill="#1f7a8c"/></g>
<g transform="translate(180 530) rotate(6)" filter="url(#shadow)"><rect x="0" y="0" width="120" height="170" rx="8" fill="#fff" stroke="#1d2433" stroke-width="4"/><rect x="14" y="14" width="92" height="142" rx="4" fill="#f7c948"/></g>
<g transform="translate(1380 540)" filter="url(#shadow)"><rect x="0" y="0" width="60" height="60" fill="#7a5bd6"/><rect x="70" y="0" width="60" height="60" fill="#f7c948"/><rect x="0" y="70" width="60" height="60" fill="#fff"/><rect x="70" y="70" width="60" height="60" fill="#1f7a8c"/></g>
<!-- sand timer -->
<g transform="translate(760 500)" filter="url(#shadow)"><rect x="-40" y="-8" width="80" height="12" fill="#6b4523"/><rect x="-40" y="110" width="80" height="12" fill="#6b4523"/><path d="M-30 4 L30 4 L5 58 L30 110 L-30 110 L-5 58Z" fill="#dff3f7" stroke="#1d2433" stroke-width="4"/><path d="M-20 8 L20 8 L1 50 L-1 50Z" fill="#f7c948"/><path d="M-26 108 L26 108 L0 88Z" fill="#f7c948"/></g>
<rect width="1600" height="700" filter="url(#grain)"/>
</svg>
