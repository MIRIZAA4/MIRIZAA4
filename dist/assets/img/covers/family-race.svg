 <circle r="250" fill="#f6f1e6"/>
 <path d="M0 0 L0 -230 A230 230 0 0 1 230 0Z" fill="#f7c948"/>
 <path d="M0 0 L230 0 A230 230 0 0 1 0 230Z" fill="#1f7a8c"/>
