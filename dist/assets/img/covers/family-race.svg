 <circle r="250" fill="none" stroke="#1d2433" stroke-width="12"/>
 <circle r="34" fill="#1d2433"/><circle r="14" fill="#f6f1e6"/>
 <g fill="#1d2433"><rect x="90" y="-150" width="46" height="46" transform="rotate(45 113 -127)" opacity=".15"/><rect x="90" y="104" width="46" height="46" transform="rotate(45 113 127)" opacity=".15"/><rect x="-136" y="104" width="46" height="46" transform="rotate(45 -113 127)" opacity=".15"/><rect x="-136" y="-150" width="46" height="46" transform="rotate(45 -113 -127)" opacity=".15"/></g>
</g>
<path d="M570 110 L630 110 L600 165Z" fill="#f6f1e6" stroke="#1d2433" stroke-width="8"/>
<!-- cups stack -->
<g transform="translate(150 470)" filter="url(#shadow)">
 <g fill="#e9ecef" stroke="#9aa0a6" stroke-width="3"><path d="M0 100 l10 60 h60 l10 -60z"/><path d="M80 100 l10 60 h60 l10 -60z"/><path d="M160 100 l10 60 h60 l10 -60z"/><path d="M40 40 l10 60 h60 l10 -60z"/><path d="M120 40 l10 60 h60 l10 -60z"/><path d="M80 -20 l10 60 h60 l10 -60z"/></g>
</g>
<!-- hourglass -->
<g transform="translate(980 500)" filter="url(#shadow)">
 <rect x="-60" y="-10" width="120" height="16" fill="#8a5a2b"/><rect x="-60" y="150" width="120" height="16" fill="#8a5a2b"/>
 <path d="M-45 6 L45 6 L8 78 L45 150 L-45 150 L-8 78Z" fill="#dff3f7" stroke="#1d2433" stroke-width="5"/>
 <path d="M-30 12 L30 12 L2 70 L-2 70Z" fill="#f7c948"/><path d="M-38 148 L38 148 L0 120Z" fill="#f7c948"/>
</g>
<!-- coins -->
<g fill="#f3d27a" stroke="#b9975b" stroke-width="3"><ellipse cx="330" cy="660" rx="26" ry="9"/><ellipse cx="338" cy="650" rx="26" ry="9"/><ellipse cx="346" cy="640" rx="26" ry="9"/><ellipse cx="400" cy="665" rx="26" ry="9"/></g>
