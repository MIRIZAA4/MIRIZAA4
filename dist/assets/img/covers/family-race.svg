<g><rect x="200" y="120" width="14" height="14" fill="#e2542b" transform="rotate(20 207 127)"/><rect x="980" y="150" width="14" height="14" fill="#f7c948" transform="rotate(-30 987 157)"/><rect x="300" y="260" width="12" height="12" fill="#7a5bd6" transform="rotate(45 306 266)"/><rect x="900" y="300" width="12" height="12" fill="#1f7a8c"/><rect x="1050" y="380" width="14" height="14" fill="#e2542b" transform="rotate(30 1057 387)"/><rect x="120" y="330" width="12" height="12" fill="#f7c948" transform="rotate(15 126 336)"/><circle cx="420" cy="180" r="6" fill="#1f7a8c"/><circle cx="820" cy="120" r="6" fill="#7a5bd6"/></g>
