<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חני כהן · צילום — מושן</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;height:100%;background:#0d0609;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block}
  #play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#F1D9A0;font:500 28px Heebo,sans-serif;cursor:pointer;background:rgba(13,6,9,.35)}
  body.render #play{display:none}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="play">▶ לחצו לניגון</div>
<audio id="music" src="out/music.wav" preload="auto"></audio>
<script src="src/core.js"></script>
<script src="src/photos.js"></script>
<script src="src/scenes.js"></script>
<script>
(async () => {
  const render = location.search.includes('render');
  if (render) document.body.classList.add('render');
  TL = await (await fetch('timeline.json')).json();
  B = 60 / TL.bpm;
  const loads = [];
  for (const w of [400, 500, 700, 900]) loads.push(document.fonts.load(`${w} 40px "Frank Ruhl Libre"`, 'אבגד'));
  for (const w of [200, 300, 400, 500, 700]) loads.push(document.fonts.load(`${w} 40px "Heebo"`, 'אבגד'));
  for (const w of [300, 400, 500]) loads.push(document.fonts.load(`${w} 40px "IBM Plex Mono"`, 'ABC123'));
  await Promise.all(loads);
  await buildPhotos();
  buildNoise();
  g = document.getElementById('c').getContext('2d');
  window.renderFrame = (f) => { renderBeat(f / TL.fps / B, f); };
  window.frameJPEG = (f, q = .95) => { window.renderFrame(f); return document.getElementById('c').toDataURL('image/jpeg', q); };
  window.READY = true;
  renderBeat(0);
  if (render) return;
  const audio = document.getElementById('music');
  const total = TL.totalBeats * B;
  let t0 = null;
  const tick = (now) => {
    let t = audio.duration && !audio.paused ? audio.currentTime : (now - t0) / 1000;
    if (t >= total) { t = 0; t0 = now; audio.currentTime = 0; }
    renderBeat(t / B, Math.floor(t * 30));
    requestAnimationFrame(tick);
  };
  document.getElementById('play').onclick = (e) => {
    e.currentTarget.style.display = 'none';
    audio.loop = true; audio.play().catch(() => {});
    t0 = performance.now(); requestAnimationFrame(tick);
  };
})();
</script>
</body>
</html>
